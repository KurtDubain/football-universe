name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Changelog consistency
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: pnpm changelog:check

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build and check bundle budget
        run: |
          pnpm build
          pnpm bundle:check

  browser-audit:
    runs-on: ubuntu-latest
    needs: build
    env:
      AUDIT_URL: http://127.0.0.1:4173
      AUDIT_SEED: 20260713
      AUDIT_SEASONS: ${{ github.event_name == 'pull_request' && '2' || '10' }}
      AUDIT_REPORT: /tmp/football-current-audit.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production audit app
        run: pnpm build:audit

      - name: Start preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/football-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "$AUDIT_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/football-preview.log
          exit 1

      - name: Run current-version browser audit
        run: pnpm audit:current

      - name: Verify automatic PWA updates
        run: pnpm verify:pwa-update

      - name: Audit mobile advance performance
        env:
          PERF_URL: http://127.0.0.1:4173/?audit=1
          PERF_REPORT: /tmp/football-advance-performance.json
        run: pnpm audit:advance-performance

      - name: Start match fixture server
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4174 > /tmp/football-match-fixture.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4174/scripts/fixtures/animation-preview.html" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/football-match-fixture.log
          exit 1

      - name: Verify tactical match presentation
        env:
          VERIFY_URL: http://127.0.0.1:4174
        run: pnpm verify:match-tactics

      - name: Verify full match presentation matrix
        if: github.event_name != 'pull_request'
        env:
          VERIFY_URL: http://127.0.0.1:4174
          ANIMATION_AUDIT_URL: http://127.0.0.1:4173
        run: |
          pnpm verify:match-set-pieces
          pnpm verify:match-shootout
          pnpm audit:animation-performance

      - name: Upload audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-version-browser-audit
          path: |
            /tmp/football-current-audit.json
            /tmp/football-advance-performance.json
            /tmp/football-preview.log
            /tmp/football-match-fixture.log
            /tmp/football-match-*.png
            /tmp/football-set-piece-*.png
          if-no-files-found: ignore
