name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Changelog consistency
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: pnpm changelog:check

      - name: Current documentation
        run: pnpm docs:check

      - name: Tournament music assets
        run: pnpm audio:check

      - name: Script portability
        run: pnpm scripts:check

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build and check bundle budget
        run: |
          pnpm build
          pnpm bundle:check

  browser-audit:
    runs-on: ubuntu-latest
    needs: build
    env:
      AUDIT_URL: http://127.0.0.1:4173
      AUDIT_SEED: 20260713
      AUDIT_SEASONS: ${{ github.event_name == 'pull_request' && '2' || '10' }}
      AUDIT_REPORT: /tmp/football-current-audit.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke suite
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: pnpm verify:smoke

      - name: Run full browser suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm verify:full

      - name: Upload audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-version-browser-audit
          path: |
            /tmp/football-current-audit.json
            /tmp/football-advance-performance.json
            /tmp/football-preview.log
            /tmp/football-match-fixture.log
            /tmp/football-match-*.png
            /tmp/football-set-piece-*.png
          if-no-files-found: ignore
